pipeline:
  name: olist_data_pipeline
  version: "1.0.0"
  batch_date_split: "2018-06-01"

storage:
  bronze_path: "data_lake/bronze/olist"
  silver_path: "data_lake/silver"
  quarantine_path: "data_lake/quarantine"
  reports_path: "reports"

database:
  host_env: "POSTGRES_HOST"
  port_env: "POSTGRES_PORT"
  db_env: "POSTGRES_DB"
  user_env: "POSTGRES_USER"
  password_env: "POSTGRES_PASSWORD"
  jdbc_url_env: "POSTGRES_JDBC_URL"
  driver: "org.postgresql.Driver"

quality_gate:
  max_quarantine_ratio: 0.10
